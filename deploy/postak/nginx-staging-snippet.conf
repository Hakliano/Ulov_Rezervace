# Přidat do deploy/nginx/conf.d/staging.conf uvnitř server { www.staging.ulovklienty.cz }
# PŘED location / { try_files ... } — jinak přebije statický hub.
# Nezasahuje do produkčního www.ulovklienty.cz/postak/ (žádný redirect z LIVE).

    # resolver už může být ve staging.conf u Materiálníku — stačí jeden na server block.
    set $staging_postak ulov-staging-postak:8000;

    location = /postak {
        return 301 /postak/;
    }
    location /postak/ {
        proxy_pass http://$staging_postak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 25m;
    }
