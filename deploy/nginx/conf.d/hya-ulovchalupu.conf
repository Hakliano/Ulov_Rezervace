# ULOV CHALUPU — apex katalog na stejném LIVE backendu jako hereyouare.cz.
# Cílový soubor: /opt/ulov/deploy/nginx/conf.d/hya-ulovchalupu.conf
# Instalace: deploy/issue-ulovchalupu-cert.sh (po DNS A záznamu na VPS).
# Formát hya_access je v 00-hya-access.conf.

server {
    listen 80;
    server_name ulovchalupu.cz;

    access_log /var/log/nginx/hya-live.access.log hya_access;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ulovchalupu.cz$request_uri;
    }
}

server {
    listen 80;
    server_name www.ulovchalupu.cz;

    access_log /var/log/nginx/hya-live.access.log hya_access;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ulovchalupu.cz$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.ulovchalupu.cz;

    ssl_certificate     /etc/letsencrypt/live/ulovchalupu.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ulovchalupu.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/hya-live.access.log hya_access;

    return 301 https://ulovchalupu.cz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ulovchalupu.cz;

    ssl_certificate     /etc/letsencrypt/live/ulovchalupu.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ulovchalupu.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    access_log /var/log/nginx/hya-live.access.log hya_access;

    resolver 127.0.0.11 valid=1s ipv6=off;
    set $hya_upstream hya-live-app:8000;

    location / {
        proxy_pass http://$hya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
