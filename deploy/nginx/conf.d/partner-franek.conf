# Fraňek Autoservis — vlastní doména (izolovaný vhost)
# Web: www/provoz-franek/ · API zůstává api.ulovklienty.cz
# Cert: bash deploy/issue-partner-franek-cert.sh

server {
    listen 80;
    server_name franek-autoservis.cloud www.franek-autoservis.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name franek-autoservis.cloud www.franek-autoservis.cloud;

    ssl_certificate     /etc/letsencrypt/live/franek-autoservis.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/franek-autoservis.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/sites/provoz-franek;
    index index.html;

    location /shared/ {
        alias /var/www/sites/shared/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
