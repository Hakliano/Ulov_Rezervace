# Společný formát access logů HYA. Musí se načíst dřív než hya-live a hya-staging.
# Cíl na serveru: /opt/ulov/deploy/nginx/conf.d/00-hya-access.conf

map $uri $hya_log_uri {
    ~*^/q/[A-Za-z0-9]+/?$ /q/redacted/;
    default $uri;
}

log_format hya_access '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $hya_log_uri $server_protocol" $status $body_bytes_sent';
