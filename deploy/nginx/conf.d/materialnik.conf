# Materiálník — vlastní doména (prodejní web)
#
# DNS (A → IP serveru):
#   materialnik.cz, www.materialnik.cz, staging.materialnik.cz
#
# Tento soubor je HTTP-only (bez Let's Encrypt). Po DNS:
#   bash deploy/issue-materialnik-cert.sh
# zapne HTTPS z materialnik-ssl.conf.pending
#
# Zdroj: presentace/materialnik/  (samostatný kořen webu)

map $host $materialnik_www_root {
    default /var/www/sites/presentace/materialnik;
    staging.materialnik.cz /var/www/sites-staging/presentace/materialnik;
    materialnik.cz /var/www/sites/presentace/materialnik;
    www.materialnik.cz /var/www/sites/presentace/materialnik;
}

server {
    listen 80;
    server_name materialnik.cz www.materialnik.cz staging.materialnik.cz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root $materialnik_www_root;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
