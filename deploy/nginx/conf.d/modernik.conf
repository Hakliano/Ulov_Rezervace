# Moderník — staging + LIVE (samostatná doména)
#
# DNS (A → IP serveru):
#   modernik.cz, www.modernik.cz, staging.modernik.cz
#
# Cert po DNS:
#   certbot certonly --webroot -w /var/www/certbot \
#     -d modernik.cz -d www.modernik.cz -d staging.modernik.cz
#
# Lokální strom: modernik/ → /var/www/sites/modernik (LIVE)
#                 modernik/ → /var/www/sites-staging/modernik (staging)

map $host $modernik_www_root {
    default "";
    staging.modernik.cz /var/www/sites-staging/modernik;
    modernik.cz /var/www/sites/modernik;
    www.modernik.cz /var/www/sites/modernik;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name modernik.cz www.modernik.cz staging.modernik.cz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Moderník — staging + LIVE (root = složka modernik/)
server {
    listen 443 ssl;
    http2 on;
    server_name staging.modernik.cz modernik.cz www.modernik.cz;

    # Po vydání certu upravte cestu — dočasně lze sdílet ulov cert jen pro test bez modernik DNS
    ssl_certificate     /etc/letsencrypt/live/modernik.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modernik.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root $modernik_www_root;
    index index.html;

    location /shared/ {
        alias /var/www/sites/shared/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
