# LIVE. Na server se kopíruje až při schváleném nasazení.
# Canonical je https://hereyouare.cz. www se na něj přesměruje.
# Formát hya_access je v 00-hya-access.conf.

server {
    listen 80;
    server_name hereyouare.cz;

    access_log /var/log/nginx/hya-live.access.log hya_access;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hereyouare.cz$request_uri;
    }
}

server {
    listen 80;
    server_name www.hereyouare.cz;

    access_log /var/log/nginx/hya-live.access.log hya_access;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hereyouare.cz$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.hereyouare.cz;

    ssl_certificate     /etc/letsencrypt/live/hereyouare.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hereyouare.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/hya-live.access.log hya_access;

    return 301 https://hereyouare.cz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hereyouare.cz;

    ssl_certificate     /etc/letsencrypt/live/hereyouare.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hereyouare.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    access_log /var/log/nginx/hya-live.access.log hya_access;

    resolver 127.0.0.11 valid=1s ipv6=off;
    set $hya_upstream hya-live-app:8000;

    location / {
        proxy_pass http://$hya_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
