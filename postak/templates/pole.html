{% if form.non_field_errors %}
<p class="error">{{ form.non_field_errors|striptags }}</p>
{% endif %}
{% for field in form %}
<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}<p class="error">{{ field.errors|striptags }}</p>{% endif %}
</div>
{% endfor %}
