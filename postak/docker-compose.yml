# Lokální Pošťák. Nesahat na nginx ani na compose ULOV / Materiálníku.
# Otevření: http://127.0.0.1:8015/postak/
name: postak

services:
  web:
    build: .
    ports:
      - "8015:8000"
    environment:
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-postak-local-only}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8015,http://localhost:8015}
      FORCE_SCRIPT_NAME: ${FORCE_SCRIPT_NAME:-/postak}
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - postak_data:/data

volumes:
  postak_data:
