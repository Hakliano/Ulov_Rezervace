# Produkční nasazení ULOV KLIENTY — Django API + PostgreSQL + Redis + Celery + cron + Nginx.
# Konfigurace se čte z kořenového .env (viz .env.production.example).
#
#   cp .env.production.example .env   # a vyplnit hodnoty
#   docker compose up -d --build
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      MATERIALNIK_URL: http://materialnik:8000
      MATERIALNIK_PUBLIC_URL: https://www.ulovklienty.cz/sklad
      MATERIALNIK_STUB: "false"
      MATERIALNIK_M2M_KEY: ${MATERIALNIK_M2M_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && gunicorn salon_api.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -",
      ]
    expose:
      - "8000"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      MATERIALNIK_URL: http://materialnik:8000
      MATERIALNIK_PUBLIC_URL: https://www.ulovklienty.cz/sklad
      MATERIALNIK_STUB: "false"
      MATERIALNIK_M2M_KEY: ${MATERIALNIK_M2M_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A salon_api worker
      --loglevel=info
      --concurrency=2

  cron:
    build: ./backend
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Životní cyklus rezervací: připomínky, děkovné e-maily, GDPR anonymizace, mazání.
    # Při EMAIL_VIA_CELERY=true cron jen zařadí maily do fronty; odesílá je `worker`.
    command: >
      sh -c "while true; do
               python manage.py rezervace_zivotni_cyklus || echo 'cron beh selhal';
               sleep 3600;
             done"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      # Weby salonů — nový salon = jen složka www/salonN/, bez úpravy compose
      - ./www:/var/www/sites:ro
      # Staging statika (oddělená od LIVE)
      - ./www-staging:/var/www/sites-staging:ro
    # Periodický reload kvůli obnoveným certifikátům.
    command: >
      sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # Automatická obnova Let's Encrypt certifikátů (kontrola 2× denně).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  materialnik:
    build: ./materialnik
    container_name: ulov-materialnik
    restart: unless-stopped
    environment:
      DEBUG: "false"
      SECRET_KEY: ${MATERIALNIK_SECRET_KEY}
      ALLOWED_HOSTS: "www.ulovklienty.cz,ulovklienty.cz,materialnik,ulov-materialnik,localhost"
      CSRF_TRUSTED_ORIGINS: "https://www.ulovklienty.cz,https://ulovklienty.cz"
      ULOV_API_URL: "http://api:8000"
      ULOV_API_HOST: "api.ulovklienty.cz"
      MATERIALNIK_M2M_KEY: ${MATERIALNIK_M2M_KEY}
      FORCE_SCRIPT_NAME: "/sklad"
      SQLITE_PATH: "/data/db.sqlite3"
      FLOW_PUBLIC_URL: "https://www.ulovklienty.cz/flow/"
    volumes:
      - materialnik_data:/data
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && gunicorn materialnik_site.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 60 --access-logfile - --error-logfile -",
      ]
    expose:
      - "8000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  materialnik_data:
